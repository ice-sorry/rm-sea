    <style>
      /* Launch splash shown while the app boots */
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0c0c0c; z-index: 9999; transition: opacity .3s ease-out; }
      #splash img { width: 96px; height: 96px; border-radius: 22px; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(.94); opacity: .7; } }
    </style>
